services:
  postgres:
    image: postgres:17
    container_name: career-agent-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: career_agent
      POSTGRES_PASSWORD: career_agent_password
      POSTGRES_DB: career_agent

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: